name: model-import-check

on:
  push:
    paths:
      - "model_import/**"
      - ".github/workflows/model-import-check.yml"
      - ".github/scripts/make_tiny_models.py"
  pull_request:
    paths:
      - "model_import/**"
      - ".github/workflows/model-import-check.yml"
      - ".github/scripts/make_tiny_models.py"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: model_import/requirements.txt
      - name: Install as in model_import/README.md
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model_import/requirements.txt
          python -m pip install --no-deps onnx2kerastl==0.0.198 keras-data-format-converter==0.1.24
          python -m pip list
      - name: Build tiny fixtures
        shell: bash
        run: python .github/scripts/make_tiny_models.py .
      - name: Check passes on a valid export
        shell: bash
        run: python model_import/tl_onnx_convert_check.py tiny_ok.onnx --out-dir out
      - name: Check stops on the new exporter format
        shell: bash
        run: |
          set +e
          python model_import/tl_onnx_convert_check.py tiny_new_format.onnx --out-dir out
          code=$?
          set -e
          echo "exit code $code"
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-check-logs-${{ matrix.os }}
          path: out/*.log
          if-no-files-found: ignore
